[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "orbitfabric-fprime-adapter"
version = "0.1.0"
description = "OrbitFabric adapter for projecting mission contracts into F Prime (F´) FPP artifacts with explicit target bindings and downstream-native validation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "OrbitFabric Contributors" }
]
dependencies = [
  "jsonschema>=4.23",
  "PyYAML>=6.0",
  "rfc8785>=0.1.4"
]

[project.urls]
Homepage = "https://github.com/FAROTECH/orbitfabric-fprime-adapter"
Repository = "https://github.com/FAROTECH/orbitfabric-fprime-adapter"
Issues = "https://github.com/FAROTECH/orbitfabric-fprime-adapter/issues"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mkdocs-material>=9.5",
  "pytest>=8.0",
  "ruff>=0.5"
]

[project.scripts]
orbitfabric-fprime = "orbitfabric_fprime_adapter.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/orbitfabric_fprime_adapter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
