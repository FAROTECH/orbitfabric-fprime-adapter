kind: orbitfabric.projection_profile
profile_version: 0.1-candidate

profile:
  id: fprime-ref-native-static
  version: 0.1.0
  description: Native static acceptance Profile for the pinned F Prime Ref deployment.

integration:
  id: orbitfabric-fprime
  schema_version: 0.1-candidate

settings:
  target:
    fprime:
      version: v4.2.2
      commit: 8a62e455a90b6d4f498c332d45d65a2a819988d8
    fpp:
      version: 3.2.0
      commit: 93f484b7521a8e8894cba25b26e633cc87d8e37a
  telemetry_limits:
    critical: red
    warning: yellow

bindings:
  - id: tm.temperature
    sources:
      - domain: telemetry
        id: poc.payload.temperature_c
    config:
      kind: telemetry
      host_component: Ref.PingReceiver
      host_instance: pingRcvr
      symbol: OF_Temperature
      local_id: 16
      update: always

  - id: cmd.set_mode
    sources:
      - domain: commands
        id: poc.payload.set_mode
    config:
      kind: command
      host_component: Ref.PingReceiver
      host_instance: pingRcvr
      symbol: OF_SetMode
      local_opcode: 32
      command_kind: async
      priority: 0
      queue_full_behavior: drop

  - id: evt.mode_changed
    sources:
      - domain: events
        id: poc.payload.mode_changed
    config:
      kind: event
      host_component: Ref.PingReceiver
      host_instance: pingRcvr
      symbol: OF_ModeChanged
      local_id: 48
      severity: activity_high

  - id: pkt.hk
    sources:
      - domain: packets
        id: housekeeping.fast
    config:
      kind: packet
      packet_set: RefPackets
      packet_name: OF_HousekeepingFast
      packet_id: 100
      group: 1
