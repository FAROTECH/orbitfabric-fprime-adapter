site_name: OrbitFabric F Prime Adapter
site_description: OrbitFabric adapter for projecting mission contracts into F Prime (F´) FPP artifacts.
site_url: https://farotech.github.io/orbitfabric-fprime-adapter/
repo_url: https://github.com/FAROTECH/orbitfabric-fprime-adapter
repo_name: FAROTECH/orbitfabric-fprime-adapter
edit_uri: ""

docs_dir: docs

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - Product contract: product-contract.md
  - F Prime Projection Profile: projection-profile.md
  - Architecture and ownership: architecture-and-ownership.md
  - Target compatibility: target-compatibility.md
  - Integration Coverage: integration-coverage.md
  - Development and verification: development.md
