site_name: OrbitFabric F Prime Adapter
site_description: OrbitFabric adapter for projecting mission contracts into F Prime (F') FPP artifacts.
site_url: https://farotech.github.io/orbitfabric-fprime-adapter/
repo_url: https://github.com/FAROTECH/orbitfabric-fprime-adapter
repo_name: FAROTECH/orbitfabric-fprime-adapter
edit_uri: ""

docs_dir: docs

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

nav:
  - Home: index.md
  - User:
      - Getting Started: getting-started.md
      - Reference Example: reference-example.md
      - F Prime Projection Profile: projection-profile.md
      - Core input and Integration Result: core-input-and-result.md
      - Integration Coverage: integration-coverage.md
  - Architecture:
      - Product contract: product-contract.md
      - Architecture and ownership: architecture-and-ownership.md
      - Target compatibility: target-compatibility.md
  - Developer / Contributor:
      - Development and verification: development.md
  - Releases:
      - 0.1.0: releases/0.1.0.md
