name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install adapter and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install exact OrbitFabric Core conformance baseline
        run: |
          python -m pip install "orbitfabric @ git+https://github.com/FAROTECH/orbitfabric.git@4377d6656c62aa1dc19a7ed81d2de872b6b22ccd"

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel owns required packaged assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          required = {
              "orbitfabric_fprime_adapter/integration_package.json",
              "orbitfabric_fprime_adapter/schemas/profile-0.1.schema.json",
              "orbitfabric_fprime_adapter/compatibility/fprime-v4.2.2-fpp-3.2.0.json",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Missing wheel assets: " + ", ".join(missing))
          PY

      - name: Build documentation
        run: mkdocs build --strict

  native-static:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Checkout exact F Prime source
        uses: actions/checkout@v4
        with:
          repository: nasa/fprime
          ref: 8a62e455a90b6d4f498c332d45d65a2a819988d8
          path: _native/fprime
          submodules: recursive

      - name: Checkout exact FPP source
        uses: actions/checkout@v4
        with:
          repository: nasa/fpp
          ref: 93f484b7521a8e8894cba25b26e633cc87d8e37a
          path: _native/fpp

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact native toolchain and adapter wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -r ./_native/fprime/requirements.txt
          python -m pip install --force-reinstall --no-deps ./_native/fpp
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl
          python - <<'PY'
          import importlib.metadata
          print("fprime-fpp", importlib.metadata.version("fprime-fpp"))
          print("orbitfabric-fprime-adapter", importlib.metadata.version("orbitfabric-fprime-adapter"))
          PY

      - name: Run canonical native static acceptance
        run: bash native_acceptance/run_static.sh "$PWD/_native/fprime" "$PWD/_native/fpp" "$PWD/.native-static-work"

      - name: Upload native static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fprime-native-static-acceptance
          path: .native-static-work/evidence
          if-no-files-found: warn

  installed-lifecycle:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout exact OrbitFabric Core baseline
        uses: actions/checkout@v4
        with:
          repository: FAROTECH/orbitfabric
          ref: 4377d6656c62aa1dc19a7ed81d2de872b6b22ccd
          path: _orbitfabric_core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host tooling and exact Core baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install ./_orbitfabric_core

      - name: Run installed lifecycle control
        run: bash .github/scripts/installed-lifecycle.sh

      - name: Upload installed lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fprime-adapter-installed-lifecycle
          path: /tmp/orbitfabric-fprime-installed-lifecycle/evidence
          if-no-files-found: warn

  release-proof:
    needs:
      - installed-lifecycle
      - native-static
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout exact OrbitFabric Core baseline
        uses: actions/checkout@v4
        with:
          repository: FAROTECH/orbitfabric
          ref: 4377d6656c62aa1dc19a7ed81d2de872b6b22ccd
          path: _orbitfabric_core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host tooling and exact Core baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install ./_orbitfabric_core

      - name: Run provider-neutral release proof
        run: bash .github/scripts/release-proof.sh

      - name: Upload release proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fprime-adapter-release-proof
          path: /tmp/orbitfabric-fprime-release-proof/evidence
          if-no-files-found: warn
