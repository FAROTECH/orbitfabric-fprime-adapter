name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  ORBITFABRIC_CORE_REPOSITORY: OrbitFabric/orbitfabric
  ORBITFABRIC_CORE_REF: 4377d6656c62aa1dc19a7ed81d2de872b6b22ccd

jobs:
  checks:
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install adapter and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install exact OrbitFabric Core conformance baseline
        run: |
          python -m pip install "orbitfabric @ git+https://github.com/${ORBITFABRIC_CORE_REPOSITORY}.git@${ORBITFABRIC_CORE_REF}"

      - name: Ruff
        run: ruff check .

      - name: Tests
        run: pytest -q

      - name: Build wheel
        run: python -m build --wheel

      - name: Verify wheel package boundary and required assets
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path
          import zipfile

          wheel = next(Path("dist").glob("*.whl"))
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
              manifest = json.loads(
                  archive.read("orbitfabric_fprime_adapter/integration_package.json")
              )

          required = {
              "orbitfabric_fprime_adapter/integration_package.json",
              "orbitfabric_fprime_adapter/schemas/profile-0.1.schema.json",
              "orbitfabric_fprime_adapter/compatibility/fprime-v4.2.2-fpp-3.2.0.json",
          }
          missing = sorted(required - names)
          if missing:
              raise SystemExit("Missing wheel assets: " + ", ".join(missing))

          forbidden_prefixes = (
              "examples/",
              "native_acceptance/",
              "docs/",
              "tests/",
              "coverage/",
              "tools/",
          )
          leaked = sorted(
              name for name in names if name.startswith(forbidden_prefixes)
          )
          if leaked:
              raise SystemExit("Non-runtime repository content leaked into wheel: " + ", ".join(leaked))

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          expected_version = project["project"]["version"]
          if manifest["adapter"]["version"] != expected_version:
              raise SystemExit(
                  "Packaged manifest version differs from project version: "
                  f"{manifest['adapter']['version']} != {expected_version}"
              )
          PY

      - name: Set repository-aware documentation coordinates
        shell: bash
        run: |
          owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repo="${GITHUB_REPOSITORY#*/}"
          {
            echo "ORBITFABRIC_SITE_URL=https://${owner}.github.io/${repo}/"
            echo "ORBITFABRIC_REPO_URL=https://github.com/${GITHUB_REPOSITORY}"
            echo "ORBITFABRIC_REPO_NAME=${GITHUB_REPOSITORY}"
          } >> "$GITHUB_ENV"

      - name: Build documentation
        run: mkdocs build --strict

  native-static:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Checkout exact F Prime source
        uses: actions/checkout@v4
        with:
          repository: nasa/fprime
          ref: 8a62e455a90b6d4f498c332d45d65a2a819988d8
          path: _native/fprime
          submodules: recursive

      - name: Checkout exact FPP source
        uses: actions/checkout@v4
        with:
          repository: nasa/fpp
          ref: 93f484b7521a8e8894cba25b26e633cc87d8e37a
          path: _native/fpp
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install official pinned toolchain and adapter wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -r ./_native/fprime/requirements.txt
          test "$(git -C ./_native/fpp rev-list -n 1 v3.2.0)" = "93f484b7521a8e8894cba25b26e633cc87d8e37a"
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl
          python - <<'PY'
          import importlib.metadata
          from orbitfabric_fprime_adapter.constants import VERSION

          fpp_version = importlib.metadata.version("fprime-fpp")
          adapter_version = importlib.metadata.version("orbitfabric-fprime-adapter")
          print("fprime-fpp", fpp_version)
          print("orbitfabric-fprime-adapter", adapter_version)
          if fpp_version != "3.2.0":
              raise SystemExit(f"expected official fprime-fpp 3.2.0, got {fpp_version}")
          if adapter_version != VERSION:
              raise SystemExit(
                  f"wheel metadata version {adapter_version} != canonical version {VERSION}"
              )
          PY

      - name: Run canonical native static acceptance
        run: bash native_acceptance/run_static.sh "$PWD/_native/fprime" "$PWD/_native/fpp" "$PWD/.native-static-work"

      - name: Upload native static evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fprime-native-static-acceptance
          path: .native-static-work/evidence
          if-no-files-found: warn

  native-runtime:
    needs: native-static
    runs-on: ubuntu-latest

    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Checkout exact F Prime source
        uses: actions/checkout@v4
        with:
          repository: nasa/fprime
          ref: 8a62e455a90b6d4f498c332d45d65a2a819988d8
          path: _native/fprime
          submodules: recursive

      - name: Checkout exact FPP source
        uses: actions/checkout@v4
        with:
          repository: nasa/fpp
          ref: 93f484b7521a8e8894cba25b26e633cc87d8e37a
          path: _native/fpp
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install official pinned toolchain and adapter wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -r ./_native/fprime/requirements.txt
          test "$(git -C ./_native/fpp rev-list -n 1 v3.2.0)" = "93f484b7521a8e8894cba25b26e633cc87d8e37a"
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl

      - name: Run canonical GDS closed-loop acceptance
        run: bash native_acceptance/run_runtime.sh "$PWD/_native/fprime" "$PWD/_native/fpp" "$PWD/.native-runtime-work"

      - name: Upload native runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fprime-native-runtime-acceptance
          path: .native-runtime-work/evidence
          if-no-files-found: warn

  reference-example:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Checkout exact OrbitFabric Core baseline
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORBITFABRIC_CORE_REPOSITORY }}
          ref: ${{ env.ORBITFABRIC_CORE_REF }}
          path: _orbitfabric_core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install exact Core baseline and adapter wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install ./_orbitfabric_core
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl

      - name: Run Reference Example contract evolution proof
        run: |
          python examples/reference-contract-evolution/verify_reference_example.py \
            --core-root "$PWD/_orbitfabric_core" \
            --work-dir "$PWD/.reference-example-work"

      - name: Upload Reference Example evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fprime-reference-contract-evolution
          path: .reference-example-work/reference-example-proof.json
          if-no-files-found: warn

  reference-example-native:
    needs: reference-example
    runs-on: ubuntu-latest

    steps:
      - name: Checkout adapter
        uses: actions/checkout@v4

      - name: Checkout exact F Prime source
        uses: actions/checkout@v4
        with:
          repository: nasa/fprime
          ref: 8a62e455a90b6d4f498c332d45d65a2a819988d8
          path: _native/fprime
          submodules: recursive

      - name: Checkout exact FPP source
        uses: actions/checkout@v4
        with:
          repository: nasa/fpp
          ref: 93f484b7521a8e8894cba25b26e633cc87d8e37a
          path: _native/fpp
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout exact OrbitFabric Core baseline
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORBITFABRIC_CORE_REPOSITORY }}
          ref: ${{ env.ORBITFABRIC_CORE_REF }}
          path: _orbitfabric_core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pinned toolchain, Core baseline and adapter wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -r ./_native/fprime/requirements.txt
          test "$(git -C ./_native/fpp rev-list -n 1 v3.2.0)" = "93f484b7521a8e8894cba25b26e633cc87d8e37a"
          python -m pip install ./_orbitfabric_core
          python -m build --wheel
          python -m pip install --force-reinstall dist/*.whl

      - name: Run native Reference Example architecture-evolution proof
        run: |
          bash native_acceptance/reference_example/run_native.sh \
            "$PWD/_native/fprime" \
            "$PWD/_native/fpp" \
            "$PWD/_orbitfabric_core" \
            "$PWD/.reference-example-native-work"

      - name: Upload native Reference Example evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fprime-reference-contract-evolution-native
          path: .reference-example-native-work/evidence
          if-no-files-found: warn

  installed-lifecycle:
    needs: checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout exact OrbitFabric Core baseline
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORBITFABRIC_CORE_REPOSITORY }}
          ref: ${{ env.ORBITFABRIC_CORE_REF }}
          path: _orbitfabric_core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host tooling and exact Core baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install ./_orbitfabric_core

      - name: Run installed lifecycle control
        run: bash .github/scripts/installed-lifecycle.sh

      - name: Upload installed lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fprime-adapter-installed-lifecycle
          path: /tmp/orbitfabric-fprime-installed-lifecycle/evidence
          if-no-files-found: warn

  release-proof:
    needs:
      - installed-lifecycle
      - native-runtime
      - reference-example-native
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout exact OrbitFabric Core baseline
        uses: actions/checkout@v4
        with:
          repository: ${{ env.ORBITFABRIC_CORE_REPOSITORY }}
          ref: ${{ env.ORBITFABRIC_CORE_REF }}
          path: _orbitfabric_core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install host tooling and exact Core baseline
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install ./_orbitfabric_core

      - name: Run provider-neutral release proof
        run: bash .github/scripts/release-proof.sh

      - name: Upload release proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fprime-adapter-release-proof
          path: /tmp/orbitfabric-fprime-release-proof/evidence
          if-no-files-found: warn
